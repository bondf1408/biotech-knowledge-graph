<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Biotech Knowledge Graph — DVA / CBGVA / THCVA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }

/* ── Controls bar ── */
#controls {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  background: rgba(15,23,42,0.97); border-bottom: 1px solid #1e293b; flex-wrap: wrap;
}
#controls h1 { font-size: 12px; font-weight: 700; color: #64748b; white-space: nowrap; }
.btn-group { display: flex; gap: 3px; flex-wrap: wrap; }
.filter-btn {
  padding: 2px 9px; border-radius: 20px; border: 1.5px solid;
  font-size: 10px; font-weight: 700; cursor: pointer; transition: opacity .15s; background: transparent;
}
.filter-btn.inactive { opacity: 0.25; }
.sep { width: 1px; background: #1e293b; align-self: stretch; margin: 0 4px; }
#search { background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
  border-radius: 6px; padding: 3px 8px; font-size: 11px; width: 140px; }
#search::placeholder { color: #475569; }
#hint { font-size: 10px; color: #334155; }

/* ── Selection tray ── */
#sel-tray {
  position: fixed; top: 38px; left: 50%; transform: translateX(-50%); z-index: 290;
  display: none; align-items: center; gap: 8px; padding: 5px 12px;
  background: rgba(15,23,42,0.97); border: 1px solid #3b82f6; border-radius: 20px;
  font-size: 11px; color: #93c5fd; white-space: nowrap;
}
#sel-tray b { color: #60a5fa; }
#sel-tray button { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd;
  border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; }
#sel-tray button:hover { background: #2563eb; color: #fff; }
#sel-chips { display: flex; gap: 4px; flex-wrap: wrap; max-width: 500px; }
.sel-chip { padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 700; cursor: pointer; }
.sel-chip:hover { opacity: 0.7; }

/* ── Panel base ── */
.panel {
  position: fixed; z-index: 200; width: 310px;
  background: rgba(10,18,36,0.98); border: 1px solid #334155;
  border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  display: none; overflow: hidden; min-width: 260px;
}
.panel-header {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 11px; cursor: grab; background: rgba(30,41,59,0.9);
  border-bottom: 1px solid #1e293b; flex-shrink: 0;
}
.panel-header:active { cursor: grabbing; }
.panel-title { flex: 1; font-size: 12px; font-weight: 700; color: #e2e8f0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-btn { background: none; border: none; color: #475569; cursor: pointer;
  font-size: 14px; padding: 0 3px; line-height: 1; flex-shrink: 0; }
.panel-btn:hover { color: #e2e8f0; }
.panel-body { padding: 11px; overflow-y: auto; max-height: 56vh; transition: max-height .2s, padding .2s; }
.panel-body.collapsed { max-height: 0; padding: 0; overflow: hidden; }

/* ── Node card internals ── */
.card-badge { display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
.card-desc { font-size: 12px; color: #e2e8f0; line-height: 1.6; margin-bottom: 8px; }
.card-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin-bottom: 8px; }
.card-meta-k { font-size: 10px; color: #64748b; white-space: nowrap; }
.card-meta-v { font-size: 11px; color: #f1f5f9; }
.conf-bar { display: inline-flex; gap: 2px; }
.conf-pip { width: 8px; height: 8px; border-radius: 2px; }
.quant-block { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px;
  padding: 7px 9px; margin-bottom: 8px; }
.quant-row { font-size: 11px; color: #cbd5e1; padding: 2px 0;
  border-bottom: 1px solid #1e293b; display: flex; gap: 6px; }
.quant-row:last-child { border-bottom: none; }
.quant-k { color: #94a3b8; flex-shrink: 0; }
.quant-v { color: #ffffff; font-weight: 600; }
.tag-strip { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 8px; }
.tag { background: #1e293b; border-radius: 3px; padding: 1px 5px; font-size: 10px; color: #64748b; }
.sec-hdr { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: #334155; margin: 10px 0 5px; }
.rel-row {
  display: flex; align-items: center; gap: 5px; padding: 4px 7px;
  border-radius: 6px; margin-bottom: 2px; cursor: pointer;
  border: 1px solid transparent; transition: background .1s;
}
.rel-row:hover { background: #1e293b; border-color: #334155; }
.rel-dir { font-size: 13px; font-weight: 800; flex-shrink: 0; }
.rel-name { flex: 1; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-lbl { font-size: 9px; color: #475569; flex-shrink: 0; background: #1e293b; padding: 1px 4px; border-radius: 3px; }

/* ── Connection panel ── */
#conn-panel { bottom: 12px; right: 14px; width: 300px; }
.conn-node { background: #0f172a; border: 1px solid #1e293b; border-radius: 7px; padding: 9px 10px; margin-bottom: 6px; }
.conn-node-title { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
.conn-node-desc { font-size: 11px; color: #cbd5e1; line-height: 1.5; }
.conn-arrow { text-align: center; font-size: 22px; color: #334155; margin: 2px 0; line-height: 1; }
.conn-lbl { text-align: center; background: #1e293b; border-radius: 5px;
  padding: 4px 10px; font-size: 12px; font-weight: 600; color: #94a3b8; margin: 4px 0 6px; }

/* ── Compare panel ── */
#cmp-panel { top: 52px; right: 14px; width: 340px; }
.cmp-cards { display: flex; flex-direction: column; gap: 8px; }
.cmp-card { background: #0f172a; border-radius: 7px; border: 1px solid #1e293b; padding: 9px; }
.cmp-card-title { font-size: 11px; font-weight: 700; margin-bottom: 3px; }
.cmp-card-desc { font-size: 10px; color: #64748b; line-height: 1.5; }
.cmp-inner-links { margin-top: 6px; }
.cmp-link { font-size: 10px; color: #3b82f6; padding: 1px 0; }

/* ── Legend ── */
.legend {
  position: fixed; right: 12px; top: 46px; z-index: 100;
  background: rgba(10,18,36,0.95); border: 1px solid #1e293b;
  border-radius: 8px; padding: 8px 10px; max-height: calc(100vh - 60px); overflow-y: auto;
}
.legend-item { display: flex; align-items: center; gap: 5px; margin-bottom: 4px;
  font-size: 10px; color: #64748b; cursor: pointer; }
.legend-item:hover { color: #94a3b8; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
#zoom-info { position: fixed; bottom: 10px; right: 12px; font-size: 10px; color: #334155; z-index: 100; }

/* ── Graph styles ── */
svg { width: 100vw; height: 100vh; }
.link { stroke-opacity: 0.35; cursor: pointer; transition: stroke-opacity .15s; }
.link.sel-link { stroke-opacity: 1; stroke-width: 3; }
.link.dimmed { stroke-opacity: 0.05 !important; }
.node circle { stroke-width: 1.5; cursor: pointer; }
.node circle:hover { stroke-width: 3; }
.node text { pointer-events: none; fill: #ffffff; font-size: 10px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
.node.dimmed { opacity: 0.18; }
.node.highlighted circle { stroke-width: 3.5; filter: drop-shadow(0 0 6px currentColor) brightness(1.35); }
.node.selected circle { stroke-width: 3.5; filter: drop-shadow(0 0 8px currentColor); }
.node.searched circle { stroke-width: 4; filter: brightness(1.5); }
</style>
</head>
<body>

<div id="controls">
  <h1>🧬 DVA/CBGVA/THCVA Graph</h1>
  <div class="btn-group" id="filter-btns"></div>
  <div class="sep"></div>
  <input type="text" id="search" placeholder="Поиск...">
  <div class="sep"></div>
  <span id="hint">Клик = карточка · Ctrl+Клик = выделение · Scroll = зум</span>
</div>

<div id="sel-tray">

  <div id="sel-chips"></div>
  <button onclick="openCompare()">Сравнить</button>
  <button onclick="clearSelection()">✕ Очистить</button>
</div>

<!-- Node card -->
<div class="panel" id="node-panel" style="bottom:12px;left:12px;">
  <div class="panel-header" id="node-hdr">
    <span class="panel-title" id="node-title">—</span>
    <button class="panel-btn" id="node-col-btn" onclick="togglePanel('node')" title="Свернуть">▾</button>

  </div>
  <div class="panel-body" id="node-body"></div>
</div>

<!-- Connection detail -->
<div class="panel" id="conn-panel">

    <button class="panel-btn" onclick="closePanel('conn')" title="Закрыть">✕</button>
  </div>
  <div class="panel-body" id="conn-body"></div>
</div>

<!-- Compare panel -->
<div class="panel" id="cmp-panel">
  <div class="panel-header" id="cmp-hdr">
    <span class="panel-title" id="cmp-title">Сравнение</span>
    <button class="panel-btn" id="cmp-col-btn" onclick="togglePanel('cmp')" title="Свернуть">▾</button>
    <button class="panel-btn" onclick="closePanel('cmp')" title="Закрыть">✕</button>
  </div>
  <div class="panel-body" id="cmp-body"></div>
</div>

<div class="legend" id="legend"></div>
<div id="zoom-info">—</div>
<svg id="graph"></svg>

// D3 GRAPH
// ══════════════════════════════════════════════════════════════════════════════
const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select("#graph").attr("viewBox", `0 0 ${W} ${H}`);
const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.08, 5]).on("zoom", e => {
  g.attr("transform", e.transform);
  document.getElementById("zoom-info").textContent = `${e.transform.k.toFixed(2)}×`;
});
svg.call(zoom);
svg.on("click", e => {
  if(e.target.tagName === "svg" || e.target.tagName === "g"){
    applyDim();
    nodeSel.classed("highlighted",false);
    nodeSel.classed("dimmed",n=>hiddenTypes.has(n.type));
    linkSel.classed("dimmed",false);
  }
});

const nodeMap = new Map(nodes.map(n => [n.id, n]));
const processedLinks = links.map(l => ({source:l.s, target:l.t, label:l.lbl, weight:l.w||1}))
  .filter(l => nodeMap.has(l.source) && nodeMap.has(l.target));

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(processedLinks).id(d=>d.id).distance(d=>130-d.weight*18).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-280))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collision", d3.forceCollide(d=>TYPES[d.type].r+8));

const linkG = g.append("g");
const linkSel = linkG.selectAll("line").data(processedLinks).enter().append("line")
  .attr("class","link")
  .attr("stroke", d => { const t=nodeMap.get(d.target.id||d.target); return t?TYPES[t.type]?.color+"80":"#33415580"; })
  .attr("stroke-width", d=>Math.max(d.weight, 2))
  .on("click",(e,d)=>{
    e.stopPropagation();
    const sid=d.source.id||d.source, tid=d.target.id||d.target;
    showConnPanel(sid,tid,d.label);
    const connIds=new Set([sid,tid]);
    nodeSel.classed("highlighted",n=>connIds.has(n.id));
    nodeSel.classed("dimmed",n=>!connIds.has(n.id));
    linkSel.classed("dimmed",l=>{ const ls=l.source.id||l.source,lt=l.target.id||l.target; return !(connIds.has(ls)||connIds.has(lt)); });
  });

const nodeG = g.append("g");
const nodeSel = nodeG.selectAll(".node").data(nodes).enter().append("g")
  .attr("class","node")
  .call(d3.drag()
    .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
    .on("drag", (e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on("end",  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;})
  )
  .on("click",(e,d)=>{ if(e.ctrlKey||e.metaKey){e.preventDefault();toggleSelect(d);}else{showNodePanel(d);} });

nodeSel.append("circle")
  .attr("r", d=>TYPES[d.type].r)
  .attr("fill", d=>TYPES[d.type].color+"25")
  .attr("stroke", d=>TYPES[d.type].color);

nodeSel.append("text").attr("text-anchor","middle")
  .attr("dy", d=>TYPES[d.type].r+11).text(d=>d.label);

sim.on("tick",()=>{
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
         .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
});

const legend = document.getElementById("legend");
legend.innerHTML = '<div style="font-size:10px;font-weight:700;color:#475569;margin-bottom:5px;">Типы</div>';
Object.entries(TYPES).forEach(([k,v])=>{
  legend.innerHTML += `<div class="legend-item" onclick="toggleType('${k}')">
    <div class="legend-dot" style="background:${v.color}"></div><span>${v.label}</span></div>`;
});

// ── Filter buttons ──
const hiddenTypes = new Set();
const btnCont = document.getElementById("filter-btns");
Object.entries(TYPES).forEach(([k,v])=>{
  const b = document.createElement("button");
  b.className="filter-btn active"; b.style.borderColor=v.color; b.style.color=v.color;
  b.textContent=k; b.dataset.type=k;
  b.onclick=()=>toggleType(k,b);
  btnCont.appendChild(b);
});
function toggleType(k,btn){
  if(!btn) btn=document.querySelector(`[data-type="${k}"]`);
  hiddenTypes.has(k)?hiddenTypes.delete(k):hiddenTypes.add(k);
  btn.classList.toggle("inactive",hiddenTypes.has(k));
  applyDim();
}
function applyDim(){
  nodeSel.classed("dimmed",d=>hiddenTypes.has(d.type));
  linkSel.classed("dimmed",false);
  linkSel.style("opacity",d=>{
    const st=nodeMap.get(d.source.id||d.source)?.type;
    const tt=nodeMap.get(d.target.id||d.target)?.type;
    return(hiddenTypes.has(st)||hiddenTypes.has(tt))?0.02:null;
  });
}

// ── Search ──
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase().trim();
  nodeSel.classed("searched",d=>q.length>1&&(
    d.label.toLowerCase().includes(q)||d.id.toLowerCase().includes(q)||
    d.tags.some(t=>t.toLowerCase().includes(q))||d.detail.toLowerCase().includes(q)
  ));
});

// ══════════════════════════════════════════════════════════════════════════════
// MULTI-SELECT (Ctrl+Click)
// ══════════════════════════════════════════════════════════════════════════════
const selectedIds = new Set();

function toggleSelect(d){
  selectedIds.has(d.id)?selectedIds.delete(d.id):selectedIds.add(d.id);
  updateSelection();
}
function clearSelection(){
  selectedIds.clear();
  updateSelection();
  closePanel("cmp");
}
function updateSelection(){
  nodeSel.classed("selected",n=>selectedIds.has(n.id));
  nodeSel.classed("dimmed",n=>hiddenTypes.has(n.type)&&!selectedIds.has(n.id));

  // Highlight links between selected nodes
  linkSel.classed("sel-link",l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return selectedIds.has(sid)&&selectedIds.has(tid);
  });

  const tray = document.getElementById("sel-tray");
  if(selectedIds.size===0){
    tray.style.display="none";
    applyDim();
    return;
  }
  tray.style.display="flex";
  document.getElementById("sel-count").textContent=selectedIds.size;

  const chips = document.getElementById("sel-chips");
  chips.innerHTML=[...selectedIds].map(id=>{
    const n=nodeMap.get(id); if(!n)return"";
    const c=TYPES[n.type]?.color||"#475569";
    return `<span class="sel-chip" style="background:${c}30;color:${c};border:1px solid ${c}"
      onclick="toggleSelect(nodeMap.get('${id}'))">${n.label} ×</span>`;
  }).join("");
}

function openCompare(){
  if(selectedIds.size===0) return;
  const sel=[...selectedIds].map(id=>nodeMap.get(id)).filter(Boolean);
  document.getElementById("cmp-title").textContent=`Сравнение (${sel.length})`;
  document.getElementById("cmp-body").classList.remove("collapsed");
  document.getElementById("cmp-col-btn").textContent="▾";

  // Inner links between selected nodes
  const innerLinks = processedLinks.filter(l=>{
    const sid=l.source.id||l.source, tid=l.target.id||l.target;
    return selectedIds.has(sid)&&selectedIds.has(tid);
  });

  const selSet = new Set(sel.map(n=>n.id));

  document.getElementById("cmp-body").innerHTML=`
    ${innerLinks.length?`<div style="font-size:10px;font-weight:700;color:#3b82f6;margin-bottom:8px;">
      Связи между выбранными (${innerLinks.length}):</div>
      ${innerLinks.map(l=>{
        const sid=l.source.id||l.source, tid=l.target.id||l.target;
        const sn=nodeMap.get(sid), tn=nodeMap.get(tid);
        return `<div style="font-size:11px;padding:3px 0;border-bottom:1px solid #1e293b;color:#94a3b8">
          <span style="color:${TYPES[sn?.type]?.color}">${sn?.label||sid}</span>
          <span style="color:#475569"> → [${l.label}] → </span>
          <span style="color:${TYPES[tn?.type]?.color}">${tn?.label||tid}</span>
        </div>`;}).join("")}
      <div style="margin-bottom:10px"></div>`:""}
    <div class="cmp-cards">
      ${sel.map(n=>{
        const T=TYPES[n.type]; const C=T?.color||"#475569";
        const connCount=processedLinks.filter(l=>{
          const sid=l.source.id||l.source,tid=l.target.id||l.target;
          return sid===n.id||tid===n.id;
        }).length;
        return `<div class="cmp-card" style="border-color:${C}40">
          <div class="cmp-card-title" style="color:${C}">[${n.type}] ${n.label}</div>
          <div style="font-size:10px;color:#475569;margin-bottom:4px;">
            organism: ${n.organism||"—"} · confidence: ${n.confidence||"—"} · связей: ${connCount}
          </div>
          <div class="cmp-card-desc">${n.detail}</div>
          ${n.quant&&n.quant.length?`<div style="margin-top:6px">`+n.quant.map(q=>
            `<div style="font-size:10px;color:#64748b"><b style="color:#94a3b8">${q[0]}:</b> ${q[1]}</div>`).join("")+`</div>`:""
          }
          <div style="margin-top:5px">${n.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        </div>`;
      }).join("")}
    </div>`;
  document.getElementById("cmp-panel").style.display="block";
}

// ══════════════════════════════════════════════════════════════════════════════
// PANELS
// ══════════════════════════════════════════════════════════════════════════════
function togglePanel(name){
  const body=document.getElementById(name+"-body");
  const btn=document.getElementById(name+"-col-btn");
  const c=body.classList.toggle("collapsed");
  btn.textContent=c?"▸":"▾";
}
function closePanel(name){
  document.getElementById(name+"-panel").style.display="none";
  if(name==="node"||name==="conn"){
    applyDim();
    nodeSel.classed("highlighted",false);
    nodeSel.classed("dimmed",n=>hiddenTypes.has(n.type));
    linkSel.classed("dimmed",false);
  }
}

// Draggable
["node","conn","cmp"].forEach(name=>{
  const panel=document.getElementById(name+"-panel");
  const header=document.getElementById(name+"-hdr");
  let ox=0,oy=0,sx=0,sy=0;
  header.addEventListener("mousedown",e=>{
    if(e.target.classList.contains("panel-btn"))return;
    e.preventDefault();
    const r=panel.getBoundingClientRect();
    sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    panel.style.left=ox+"px";panel.style.top=oy+"px";
    panel.style.bottom="auto";panel.style.right="auto";
    const mv=ev=>{panel.style.left=(ox+ev.clientX-sx)+"px";panel.style.top=(oy+ev.clientY-sy)+"px";};
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  });
});

// ── Confidence bar ──
function confBar(c){
  const map={high:3,medium:2,low:1};
  const n=map[c]||0;
  const colors={high:"#22c55e",medium:"#eab308",low:"#ef4444"};
  const col=colors[c]||"#475569";
  return `<span class="conf-bar">${[1,2,3].map(i=>`<span class="conf-pip" style="background:${i<=n?col:"#1e293b"}"></span>`).join("")}</span> <span style="font-size:10px;color:${col}">${c||"—"}</span>`;
}

// ── Node panel ──
function showNodePanel(d){
  const T=TYPES[d.type]; const C=T?.color||"#64748b";
  document.getElementById("node-title").textContent=d.label;
  document.getElementById("node-title").style.color=C;
  document.getElementById("node-body").classList.remove("collapsed");
  document.getElementById("node-col-btn").textContent="▾";

  const connected=processedLinks.filter(l=>{
    const sid=l.source.id||l.source,tid=l.target.id||l.target;
    return sid===d.id||tid===d.id;
  });

  document.getElementById("node-body").innerHTML=`
    <span class="card-badge" style="background:${C}20;color:${C};border:1px solid ${C}">${d.type}</span>
    <p class="card-desc">${d.detail}</p>
    <div class="card-meta">
      <span class="card-meta-k">Organism</span>
      <span class="card-meta-v">${(d.organism||"—").replace(/_/g," ")}</span>
      <span class="card-meta-k">Target</span>
      <span class="card-meta-v">${(d.target||[]).join(", ")||"—"}</span>
      <span class="card-meta-k">Pathway</span>
      <span class="card-meta-v">${d.pathway||"—"}</span>
      <span class="card-meta-k">Confidence</span>
      <span class="card-meta-v">${confBar(d.confidence)}</span>
      <span class="card-meta-k">Source</span>
      <span class="card-meta-v" style="font-size:10px;color:#475569">${d.source||"—"}</span>
    </div>
    ${d.quant&&d.quant.length?`<div class="quant-block">
      ${d.quant.map(q=>`<div class="quant-row"><span class="quant-k">${q[0]}:</span><span class="quant-v">${q[1]}</span></div>`).join("")}
    </div>`:""}
    <div class="tag-strip">${d.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    ${connected.length?`<div class="sec-hdr">Связи (${connected.length})</div>
      ${connected.map(l=>{
        const sid=l.source.id||l.source,tid=l.target.id||l.target;
        const isOut=sid===d.id;
        const other=isOut?tid:sid;
        const on=nodeMap.get(other);
        const oc=on?TYPES[on.type]?.color:"#475569";
        return `<div class="rel-row" onclick="showConnPanel('${sid}','${tid}','${l.label.replace(/'/g,"\\'")}')">
          <span class="rel-dir" style="color:${oc}">${isOut?"→":"←"}</span>
          <span class="rel-name" style="color:${oc}">${on?.label||other}</span>
          <span class="rel-lbl">${l.label}</span>
        </div>`;}).join("")}`:`<div style="font-size:11px;color:#334155;margin-top:6px">Нет связей</div>`}
  `;
  document.getElementById("node-panel").style.display="block";

  // Highlight neighbours
  const connIds=new Set([d.id]);
  connected.forEach(l=>{connIds.add(l.source.id||l.source);connIds.add(l.target.id||l.target);});
  nodeSel.classed("highlighted",n=>connIds.has(n.id));
  nodeSel.classed("dimmed",n=>!connIds.has(n.id));
  linkSel.classed("dimmed",l=>{ const ls=l.source.id||l.source,lt=l.target.id||l.target; return !connIds.has(ls)&&!connIds.has(lt); });
}

// ── Connection panel ──
function showConnPanel(srcId,tgtId,lbl){
  const src=nodeMap.get(srcId), tgt=nodeMap.get(tgtId);
  document.getElementById("conn-body").classList.remove("collapsed");
  document.getElementById("conn-col-btn").textContent="▾";

  function nodeBlock(n,fallId){
    if(!n) return `<div class="conn-node"><div class="conn-node-title">${fallId}</div></div>`;
    const C=TYPES[n.type]?.color||"#64748b";
    return `<div class="conn-node" style="border-color:${C}40">
      <div class="conn-node-title" style="color:${C}">[${n.type}] ${n.label}</div>
      <div class="conn-node-desc">${n.detail}</div>
      ${n.quant&&n.quant.length?n.quant.map(q=>`<div style="font-size:10px;margin-top:3px;color:#64748b"><b style="color:#94a3b8">${q[0]}:</b> ${q[1]}</div>`).join(""):""}
      <div style="margin-top:5px">${n.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    </div>`;
  }

  document.getElementById("conn-body").innerHTML=`
    ${nodeBlock(src,srcId)}
    <div class="conn-arrow">↓</div>
    <div class="conn-lbl">${lbl}</div>
    ${nodeBlock(tgt,tgtId)}
  `;
  document.getElementById("conn-panel").style.display="block";
}
</script>
